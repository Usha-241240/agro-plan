<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Планировщик ухода за огородом — культуры, задачи и календарь работ.">
  <title>Планировщик — AgroPlan</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app">

  <header class="app-header">
    <div class="app-header-inner">
      <a href="index.html" class="app-logo">🌱 AgroPlan</a>
      <nav class="app-nav">
        <a href="#crops-section">Культуры</a>
        <a href="#tasks-section">Задачи</a>
        <a href="#calendar-section">Календарь</a>
      </nav>
    </div>
  </header>

  <div class="app">
    <header class="page-header">
      <h1>Планировщик ухода за огородом</h1>
      <p>Управляйте культурами и задачами по уходу</p>
    </header>

    <div class="stats" id="stats">
      <div class="stat-card"><div class="value" id="stat-crops">0</div><div class="label">Культур</div></div>
      <div class="stat-card"><div class="value" id="stat-tasks">0</div><div class="label">Задач</div></div>
      <div class="stat-card"><div class="value" id="stat-done">0</div><div class="label">Выполнено</div></div>
      <div class="stat-card"><div class="value" id="stat-pending">0</div><div class="label">Осталось</div></div>
    </div>

    <section class="section" id="add-crop-section">
      <h2 class="section-title">Добавить культуру</h2>
      <form id="crop-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="crop-name">Название</label>
            <input type="text" id="crop-name" required placeholder="Например: Томаты">
          </div>
          <div class="form-group">
            <label for="crop-date">Дата посадки</label>
            <input type="date" id="crop-date" required>
          </div>
          <div class="form-group">
            <label for="crop-place">Место посадки</label>
            <input type="text" id="crop-place" required placeholder="Грядка №1">
          </div>
          <div class="form-group full">
            <label for="crop-note">Заметка</label>
            <textarea id="crop-note" placeholder="Сорт, особенности..."></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Добавить культуру</button>
      </form>
    </section>

    <section class="section" id="crops-section">
      <h2 class="section-title">Мои культуры</h2>
      <div class="toolbar">
        <input type="text" class="search-box" id="crop-search" placeholder="🔍 Поиск по названию культуры...">
      </div>
      <div class="cards-grid" id="crops-list"></div>
    </section>

    <section class="section" id="add-task-section">
      <h2 class="section-title">Добавить задачу</h2>
      <form id="task-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="task-crop">Культура</label>
            <select id="task-crop" required></select>
          </div>
          <div class="form-group">
            <label for="task-date">Дата</label>
            <input type="date" id="task-date" required>
          </div>
          <div class="form-group">
            <label for="task-type">Тип работы</label>
            <select id="task-type" required>
              <option value="полив">Полив</option>
              <option value="подкормка">Подкормка</option>
              <option value="прополка">Прополка</option>
              <option value="обработка">Обработка</option>
              <option value="сбор урожая">Сбор урожая</option>
            </select>
          </div>
          <div class="form-group full">
            <label for="task-desc">Описание</label>
            <textarea id="task-desc" placeholder="Подробности задачи..."></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Добавить задачу</button>
      </form>
    </section>

    <section class="section" id="tasks-section">
      <h2 class="section-title">Задачи</h2>
      <div class="toolbar">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">Все</button>
          <button class="filter-btn" data-filter="pending">Невыполненные</button>
          <button class="filter-btn" data-filter="done">Выполненные</button>
        </div>
      </div>
      <div class="cards-grid" id="tasks-list"></div>
    </section>

    <section class="section" id="history-section">
      <h2 class="section-title">История работ</h2>
      <div class="cards-grid" id="history-list"></div>
    </section>

    <section class="section" id="calendar-section">
      <h2 class="section-title">Календарь работ</h2>
      <div class="calendar-list" id="calendar"></div>
    </section>
  </div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h3>Редактировать задачу</h3>
      <form id="edit-form">
        <input type="hidden" id="edit-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="edit-crop">Культура</label>
            <select id="edit-crop" required></select>
          </div>
          <div class="form-group">
            <label for="edit-date">Дата</label>
            <input type="date" id="edit-date" required>
          </div>
          <div class="form-group">
            <label for="edit-type">Тип работы</label>
            <select id="edit-type" required>
              <option value="полив">Полив</option>
              <option value="подкормка">Подкормка</option>
              <option value="прополка">Прополка</option>
              <option value="обработка">Обработка</option>
              <option value="сбор урожая">Сбор урожая</option>
            </select>
          </div>
          <div class="form-group full">
            <label for="edit-desc">Описание</label>
            <textarea id="edit-desc"></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="edit-cancel">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
